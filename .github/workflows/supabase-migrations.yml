name: Validate Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/README.md"
      - ".github/workflows/supabase-migrations.yml"
  push:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/README.md"
      - ".github/workflows/supabase-migrations.yml"

permissions:
  contents: read

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Verify pinned CLI version
        run: test "$(supabase --version)" = "3.1.0"

      - name: Validate configuration and start local Supabase
        run: supabase start

      - name: Recreate database from migrations
        run: supabase db reset --no-seed
